<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modeling</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    position:relative;
    height:100vh;
    overflow:hidden;
    background:#000;
    font-family:'Arial Narrow','Arial',sans-serif;
  }
  .bg{
    position:absolute; inset:0;
    background:url('background.png') center/cover no-repeat;
    filter:brightness(.55) contrast(1.08) saturate(.9);
    z-index:0;
  }
  .nav{
    position:absolute;
    color:#fff; font-weight:900; letter-spacing:.01em;
    line-height:.85; text-transform:uppercase; text-decoration:none;
    font-size:8vw; white-space:nowrap;
    outline:none; -webkit-tap-highlight-color:transparent;
    transition:color .2s ease, transform .2s ease;
    z-index:2;
  }
  .nav:hover, .nav:focus-visible{ color:#999; transform:scale(1.15); }
  .nav:active{ color:#6b6b6b; transform:scale(1.03); }

  #modeler{ left:1%; bottom:1.8%; transform-origin:left bottom; }
  #builder{ right:2%; top:1.8%; text-align:right; transform-origin:right top; }

  .avatar-link{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    z-index:1;
    outline:none; -webkit-tap-highlight-color:transparent;
    transition:transform .2s ease, opacity .2s ease;
  }
  .avatar-link:hover, .avatar-link:focus-visible{
    opacity:.75; transform:translate(-50%,-50%) scale(1.1);
  }
  .avatar-link img{ width:10vw; display:block; }
</style>
</head>
<body>
  <div class="bg"></div>

  <a class="nav" id="modeler" href="modeler.html">Modeler</a>
  <a class="nav" id="builder" href="builder.html">Builder</a>

  <a class="avatar-link" href="index.html" aria-label="Kembali ke Home">
    <img src="icon.png" alt="">
  </a>

  <script src="https://unpkg.com/scrollreveal"></script>
  <script>
    ScrollReveal().reveal('#modeler', {
      origin:'left', distance:'60px', duration:1000, delay:200,
      opacity:0, easing:'cubic-bezier(0.5,0,0,1)', reset:false
    });
    ScrollReveal().reveal('#builder', {
      origin:'right', distance:'60px', duration:1000, delay:350,
      opacity:0, easing:'cubic-bezier(0.5,0,0,1)', reset:false
    });
    ScrollReveal().reveal('.avatar-link', {
      origin:'bottom', distance:'40px', duration:1200, delay:500,
      opacity:0, scale:0.9, easing:'cubic-bezier(0.5,0,0,1)', reset:false
    });
  </script>
</body>
</html>
