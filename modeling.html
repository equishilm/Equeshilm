<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modeling</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    position:relative;
    min-height:100vh;
    background:#000;
    font-family:'Arial Narrow','Arial',sans-serif;
  }
  .bg{
    position:fixed; inset:0;
    background:url('background.png') center/cover no-repeat;
    filter:brightness(.55) contrast(1.08) saturate(.9);
    z-index:0;
  }
  a{ color:#fff; text-decoration:none; }
  a:hover{ opacity:.75; }

  nav{
    position:relative; padding:2% 0 0 1.4%;
    display:flex; gap:2.8vw;
    font-weight:700; letter-spacing:.15em;
    font-size:.9vw; text-transform:uppercase;
    z-index:2;
  }

  h1{
    position:absolute; right:2%; top:1.8%;
    color:#fff; font-weight:900; font-size:8vw;
    letter-spacing:.01em; line-height:.85;
    text-transform:uppercase; margin:0;
    z-index:2;
  }

  .grid{
  position:relative;
  z-index:2;
  margin:6.5% 1.4% 2%;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:1%;
}

.grid img{
  width:100%;
  aspect-ratio:280/154;
  object-fit:cover;
  background:#d9d9d9;
  display:block;

  border-radius:4px;
  transition:
    transform 0.45s cubic-bezier(.2,.8,.2,1),
    box-shadow 0.45s ease,
    filter 0.45s ease;
}

/* HOVER */
.grid img:hover{
  transform:translateY(-8px) scale(1.025);
  box-shadow:0 18px 35px rgba(0,0,0,.18);
  filter:brightness(1.04);
  cursor:pointer;
}

.avatar{
  position:fixed;
  right:1.5%;
  bottom:1.5%;
  width:4.5vw;
  z-index:2;
}
.lightbox{
  position:fixed;
  inset:0;
  z-index:999;
  background:rgba(0,0,0,.88);

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:0;
  visibility:hidden;
  transition:opacity .3s ease;
}

.lightbox.active{
  opacity:1;
  visibility:visible;
}

.lightbox img{
  max-width:90vw;
  max-height:90vh;
  width:auto;
  height:auto;
  object-fit:contain;

  border-radius:4px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);

  transform:scale(.95);
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
}

.lightbox.active img{
  transform:scale(1);
}

.close{
  position:absolute;
  top:2%;
  right:2.5%;

  color:white;
  font-size:40px;
  font-weight:300;

  cursor:pointer;
  z-index:1000;

  transition:opacity .2s ease;
}

.close:hover{
  opacity:.6;
}
</style>
</head>
<body>
  <div class="bg"></div>

  <nav>
    <a href="about.html">ABOUT ME</a>
    <a href="index.html">HOME</a>
    <a href="animation.html">ANIMATION</a>
  </nav>

  <h1>Modeling</h1>

  <div class="grid" id="grid"></div>

  <img class="avatar" src="icon.png" alt="Character avatar">

<div class="lightbox" id="lightbox">
  <span class="close" id="close">&times;</span>
  <img id="lightbox-img" src="" alt="">
</div>

<script src="https://unpkg.com/scrollreveal"></script>

<script>
  const IMAGES = [
    "guts.png","gyro.png","model-03.jpg","model-04.jpg","model-05.jpg",
    "model-06.jpg","model-07.jpg","model-08.jpg","model-09.jpg","model-10.jpg",
    "model-11.jpg","model-12.jpg","model-13.jpg","model-14.jpg","model-15.jpg",
    "model-16.jpg","model-17.jpg","model-18.jpg","model-19.jpg","model-20.jpg"
  ];

  const grid = document.getElementById('grid');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const close = document.getElementById('close');

  IMAGES.forEach((src, i) => {
    const img = document.createElement('img');

    img.src = src;
    img.alt = `Model ${i + 1}`;

    img.addEventListener('click', () => {
      lightboxImg.src = src;
      lightbox.classList.add('active');
    });

    grid.appendChild(img);
  });


  /* =========================
     SCROLL REVEAL
  ========================= */

  ScrollReveal().reveal('.grid img', {
    origin: 'bottom',
    distance: '45px',
    duration: 800,
    interval: 100,
    opacity: 0,
    scale: 0.95,
    easing: 'cubic-bezier(0.5, 0, 0, 1)',
    reset: false
  });


  /* =========================
     LIGHTBOX
  ========================= */

  close.addEventListener('click', () => {
    lightbox.classList.remove('active');
  });

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) {
      lightbox.classList.remove('active');
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      lightbox.classList.remove('active');
    }
  });
</script>
</body>
</html>
